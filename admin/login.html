<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Iftikar Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
<script src="../data-store.js"></script>
</head>
<body class="admin-body">

<div class="atmosphere" aria-hidden="true">
  <div class="blob blob--orange"></div>
  <div class="blob blob--blue"></div>
  <div class="blob blob--violet"></div>
</div>

<div class="login-screen">
  <div class="login-card">
    <div class="login-card__logo"><span class="nav__logo-mark">I</span> Iftikar<span class="nav__dot">.</span> Admin</div>
    <p class="login-card__subtitle">Sign in to manage your website content.</p>

    <div class="login-card__error" id="loginError">Incorrect username or password. Please try again.</div>

    <form id="loginForm" novalidate>
      <div class="form-row">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" name="username" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="form-row">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary form-submit" style="width:100%; justify-content:center;">Log In</button>
    </form>

    <div class="login-card__hint">
      <strong>Default test login</strong> (for first-time setup only):<br>
      Username: <strong>admin</strong> &nbsp;·&nbsp; Password: <strong>Admin@123</strong><br><br>
      Please change this immediately after logging in, from Account &amp; Security inside the dashboard.
    </div>
  </div>
</div>

<script>
  // Already logged in this session? Skip straight to the dashboard.
  if (window.IftikarCMS.isLoggedIn()) {
    window.location.href = 'dashboard.html';
  }

  var form = document.getElementById('loginForm');
  var errorBox = document.getElementById('loginError');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value;

    if (window.IftikarCMS.login(user, pass)) {
      window.location.href = 'dashboard.html';
    } else {
      errorBox.classList.add('is-visible');
    }
  });
</script>

</body>
</html>
