<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15161a"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="p2card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1e23"/>
      <stop offset="100%" stop-color="#16171b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#p2bg)"/>
  <rect width="1200" height="56" fill="#1a1b1f"/>
  <circle cx="30" cy="28" r="7" fill="#ff5f57"/>
  <circle cx="55" cy="28" r="7" fill="#febc2e"/>
  <circle cx="80" cy="28" r="7" fill="#28c840"/>
  <rect x="140" y="14" width="480" height="28" rx="8" fill="#0d0d0f"/>
  <text x="160" y="33" font-family="Arial, sans-serif" font-size="14" fill="#7a7d85">api.platform.dev/console</text>

  <!-- nodes -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#c9cbd1">
    <rect x="90" y="130" width="220" height="90" rx="14" fill="url(#p2card)" stroke="#ff8a2a" stroke-width="2"/>
    <text x="200" y="182" text-anchor="middle">Client Apps</text>

    <rect x="490" y="90" width="220" height="90" rx="14" fill="url(#p2card)" stroke="#2fb8ff" stroke-width="2"/>
    <text x="600" y="142" text-anchor="middle">REST Gateway</text>

    <rect x="490" y="230" width="220" height="90" rx="14" fill="url(#p2card)" stroke="#2fb8ff" stroke-width="2"/>
    <text x="600" y="282" text-anchor="middle">Auth Service</text>

    <rect x="890" y="90" width="220" height="90" rx="14" fill="url(#p2card)" stroke="#5be3a5" stroke-width="2"/>
    <text x="1000" y="142" text-anchor="middle">Spring Boot API</text>

    <rect x="890" y="230" width="220" height="90" rx="14" fill="url(#p2card)" stroke="#5be3a5" stroke-width="2"/>
    <text x="1000" y="282" text-anchor="middle">MySQL Database</text>
  </g>

  <!-- connectors -->
  <g stroke="#454850" stroke-width="2" fill="none">
    <path d="M 310 170 L 490 135"/>
    <path d="M 310 175 L 490 270"/>
    <path d="M 710 135 L 890 135"/>
    <path d="M 710 270 L 890 275"/>
    <path d="M 1000 180 L 1000 230"/>
  </g>

  <!-- request/response log panel -->
  <rect x="90" y="400" width="1020" height="320" rx="14" fill="url(#p2card)" stroke="#2a2c32"/>
  <text x="118" y="440" font-family="monospace" font-size="15" fill="#5be3a5">200 OK  GET /api/v1/customers</text>
  <text x="118" y="470" font-family="monospace" font-size="15" fill="#5be3a5">201 CREATED  POST /api/v1/orders</text>
  <text x="118" y="500" font-family="monospace" font-size="15" fill="#ff8a2a">401 UNAUTHORIZED  GET /api/v1/reports</text>
  <text x="118" y="530" font-family="monospace" font-size="15" fill="#5be3a5">200 OK  PUT /api/v1/inventory/482</text>
  <text x="118" y="560" font-family="monospace" font-size="15" fill="#2fb8ff">204 NO CONTENT  DELETE /api/v1/sessions/91a3</text>
  <text x="118" y="590" font-family="monospace" font-size="15" fill="#5be3a5">200 OK  GET /api/v1/products?page=2</text>
  <text x="118" y="620" font-family="monospace" font-size="15" fill="#8a8d95">-- 214ms avg response · 99.98% uptime --</text>

  <g fill="#3a3c42">
    <rect x="118" y="650" width="960" height="14" rx="4"/>
    <rect x="118" y="676" width="820" height="14" rx="4" opacity="0.7"/>
  </g>
</svg>
