<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15161a"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="p3card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1e23"/>
      <stop offset="100%" stop-color="#16171b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#p3bg)"/>
  <rect width="1200" height="56" fill="#1a1b1f"/>
  <circle cx="30" cy="28" r="7" fill="#ff5f57"/>
  <circle cx="55" cy="28" r="7" fill="#febc2e"/>
  <circle cx="80" cy="28" r="7" fill="#28c840"/>
  <rect x="140" y="14" width="480" height="28" rx="8" fill="#0d0d0f"/>
  <text x="160" y="33" font-family="Arial, sans-serif" font-size="14" fill="#7a7d85">shop.commercehub.com/catalog</text>

  <!-- top nav -->
  <rect x="0" y="56" width="1200" height="70" fill="#131418"/>
  <rect x="40" y="80" width="120" height="20" rx="4" fill="#ff8a2a"/>
  <g fill="#8a8d95">
    <rect x="900" y="82" width="60" height="16" rx="4"/>
    <rect x="980" y="82" width="60" height="16" rx="4"/>
    <rect x="1060" y="82" width="100" height="16" rx="4" fill="#2fb8ff" opacity="0.85"/>
  </g>

  <!-- product grid -->
  <g>
    <rect x="60" y="160" width="260" height="300" rx="14" fill="url(#p3card)" stroke="#2a2c32"/>
    <rect x="80" y="180" width="220" height="160" rx="10" fill="#26282e"/>
    <rect x="80" y="360" width="160" height="16" rx="4" fill="#c9cbd1"/>
    <rect x="80" y="388" width="90" height="20" rx="4" fill="#ff8a2a"/>

    <rect x="340" y="160" width="260" height="300" rx="14" fill="url(#p3card)" stroke="#2a2c32"/>
    <rect x="360" y="180" width="220" height="160" rx="10" fill="#26282e"/>
    <rect x="360" y="360" width="160" height="16" rx="4" fill="#c9cbd1"/>
    <rect x="360" y="388" width="90" height="20" rx="4" fill="#ff8a2a"/>

    <rect x="620" y="160" width="260" height="300" rx="14" fill="url(#p3card)" stroke="#2a2c32"/>
    <rect x="640" y="180" width="220" height="160" rx="10" fill="#26282e"/>
    <rect x="640" y="360" width="160" height="16" rx="4" fill="#c9cbd1"/>
    <rect x="640" y="388" width="90" height="20" rx="4" fill="#ff8a2a"/>

    <!-- cart / checkout panel -->
    <rect x="900" y="160" width="240" height="500" rx="14" fill="url(#p3card)" stroke="#2fb8ff" stroke-width="2"/>
    <rect x="924" y="188" width="150" height="18" rx="4" fill="#e0e2e6"/>
    <g fill="#3a3c42">
      <rect x="924" y="230" width="192" height="60" rx="8"/>
      <rect x="924" y="300" width="192" height="60" rx="8"/>
      <rect x="924" y="370" width="192" height="60" rx="8"/>
    </g>
    <rect x="924" y="450" width="192" height="2" fill="#2a2c32"/>
    <rect x="924" y="474" width="100" height="16" rx="4" fill="#8a8d95"/>
    <rect x="1040" y="474" width="76" height="16" rx="4" fill="#c9cbd1"/>
    <rect x="924" y="560" width="192" height="46" rx="8" fill="#ff8a2a"/>
  </g>

  <!-- lower row -->
  <g>
    <rect x="60" y="490" width="260" height="170" rx="14" fill="url(#p3card)" stroke="#2a2c32"/>
    <rect x="80" y="510" width="220" height="120" rx="10" fill="#26282e"/>

    <rect x="340" y="490" width="260" height="170" rx="14" fill="url(#p3card)" stroke="#2a2c32"/>
    <rect x="360" y="510" width="220" height="120" rx="10" fill="#26282e"/>

    <rect x="620" y="490" width="260" height="170" rx="14" fill="url(#p3card)" stroke="#2a2c32"/>
    <rect x="640" y="510" width="220" height="120" rx="10" fill="#26282e"/>
  </g>
</svg>
