    <rect x="990" y="150" width="120" height="26" rx="4" fill="#e0e2e6" opacity="0.85"/>
  </g>

  <!-- chart panel -->
  <rect x="250" y="230" width="500" height="290" rx="12" fill="url(#p1card)" stroke="#2a2c32"/>
  <polyline points="280,470 340,420 400,440 460,360 520,380 580,300 640,330 700,260" fill="none" stroke="#ff8a2a" stroke-width="4"/>
  <polyline points="280,490 340,470 400,460 460,430 520,440 580,410 640,420 700,390" fill="none" stroke="#2fb8ff" stroke-width="4"/>

