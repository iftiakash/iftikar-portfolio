  <rect x="770" y="230" width="400" height="480" rx="12" fill="url(#p1card)" stroke="#2a2c32"/>
  <g fill="#3a3c42">
    <rect x="794" y="256" width="352" height="34" rx="6"/>
    <rect x="794" y="300" width="352" height="34" rx="6" opacity="0.6"/>
    <rect x="794" y="344" width="352" height="34" rx="6" opacity="0.6"/>
    <rect x="794" y="388" width="352" height="34" rx="6" opacity="0.6"/>
    <rect x="794" y="432" width="352" height="34" rx="6" opacity="0.6"/>
    <rect x="794" y="476" width="352" height="34" rx="6" opacity="0.6"/>
