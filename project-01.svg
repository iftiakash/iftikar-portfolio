    <rect x="270" y="112" width="90" height="12" rx="3" fill="#8a8d95"/>
    <rect x="270" y="150" width="140" height="26" rx="4" fill="#ff8a2a" opacity="0.9"/>

    <rect x="490" y="90" width="220" height="110" rx="12" fill="url(#p1card)" stroke="#2a2c32"/>
    <rect x="510" y="112" width="90" height="12" rx="3" fill="#8a8d95"/>
    <rect x="510" y="150" width="140" height="26" rx="4" fill="#2fb8ff" opacity="0.9"/>

    <rect x="730" y="90" width="220" height="110" rx="12" fill="url(#p1card)" stroke="#2a2c32"/>
    <rect x="750" y="112" width="90" height="12" rx="3" fill="#8a8d95"/>
    <rect x="750" y="150" width="140" height="26" rx="4" fill="#5be3a5" opacity="0.85"/>

