<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15161a"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="p1card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1e23"/>
      <stop offset="100%" stop-color="#16171b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#p1bg)"/>
  <!-- browser chrome -->
  <rect width="1200" height="56" fill="#1a1b1f"/>
  <circle cx="30" cy="28" r="7" fill="#ff5f57"/>
  <circle cx="55" cy="28" r="7" fill="#febc2e"/>
  <circle cx="80" cy="28" r="7" fill="#28c840"/>
  <rect x="140" y="14" width="480" height="28" rx="8" fill="#0d0d0f"/>
  <text x="160" y="33" font-family="Arial, sans-serif" font-size="14" fill="#7a7d85">app.businesssuite.io/dashboard</text>

  <!-- sidebar -->
  <rect x="0" y="56" width="220" height="744" fill="#131418"/>
  <rect x="24" y="88" width="120" height="20" rx="4" fill="#ff8a2a" opacity="0.9"/>
  <g fill="#8a8d95">
    <rect x="24" y="150" width="172" height="14" rx="3"/>
    <rect x="24" y="190" width="150" height="14" rx="3" fill="#2fb8ff" opacity="0.85"/>
    <rect x="24" y="230" width="160" height="14" rx="3"/>
    <rect x="24" y="270" width="130" height="14" rx="3"/>
    <rect x="24" y="310" width="145" height="14" rx="3"/>
